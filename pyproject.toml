[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veto"
version = "0.1.0"
description = "VETO: Protecting Images From Frontier AI Editing"
readme = "README.md"
requires-python = ">=3.10, <3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy>=1.24.0",
    "pillow>=11.3.0",
    "transformers>=4.53.0,<5",
    "diffusers @ git+https://github.com/huggingface/diffusers.git@v0.37.1",
    "accelerate>=1.0.0",
    "bitsandbytes>=0.41.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "lpips>=0.1.4",
    "pytorch-msssim>=1.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "wandb>=0.19.0",
    "sentencepiece>=0.2.1",
    "boltons>=25.0.0",
    "ujson>=5.11.0",
    "gradio>=4.44.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veto*"]
exclude = ["tests*", "outputs*", "checkpoints*"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]

